<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ليجند تاون 🎪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#150F2E; --panel:#1F1745; --panel2:#271C56;
  --gold:#F5B93D; --coral:#FF6F59; --teal:#2FD8C7; --cream:#FBF6EC;
  --muted:#A99FC9; --danger:#FF4D6D;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(circle at 15% 10%, rgba(245,185,61,.10), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(47,216,199,.10), transparent 40%), var(--bg);
  color:var(--cream); font-family:'Tajawal',sans-serif; min-height:100vh;
}
.display{font-family:'Lalezar',cursive;}
#app{min-height:100vh;}
.center-wrap{max-width:520px;margin:0 auto;padding:20px 16px 60px;}
 
.marquee-wrap{position:relative;text-align:center;margin:10px 0 22px;}
.marquee-title{font-size:42px;color:var(--gold);text-shadow:0 0 12px rgba(245,185,61,.55),0 0 2px #fff;padding:6px 30px;position:relative;display:inline-block;}
.bulbs{position:absolute;inset:0;pointer-events:none;}
.bulb{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px 2px rgba(245,185,61,.8);animation:blink 1.4s infinite ease-in-out;}
@keyframes blink{0%,100%{opacity:.25;}50%{opacity:1;}}
.subtitle{color:var(--muted);font-size:14px;margin-top:2px;}
.perforation{height:1px;margin:14px 0;background:repeating-linear-gradient(90deg,var(--muted) 0 8px,transparent 8px 16px);opacity:.4;}
 
.card{background:var(--panel);border:1.5px dashed rgba(245,185,61,.35);border-radius:18px;padding:18px;margin-bottom:14px;}
.card.solid{border-style:solid;border-color:rgba(255,255,255,.08);}
 
.btn{font-family:'Tajawal';font-weight:700;font-size:15px;border:none;border-radius:12px;padding:13px 16px;cursor:pointer;color:var(--bg);background:var(--gold);width:100%;transition:transform .12s ease;}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.coral{background:var(--coral);color:#fff;}
.btn.teal{background:var(--teal);color:#0c2a27;}
.btn.ghost{background:transparent;color:var(--cream);border:1.5px solid rgba(255,255,255,.25);}
.btn.small{width:auto;padding:9px 14px;font-size:13px;}
.row{display:flex;gap:10px;}
.row > *{flex:1;}
 
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,.15);background:var(--panel2);color:var(--cream);font-family:'Tajawal';font-size:15px;}
input[type=text]:focus{outline:2px solid var(--teal);}
input[type=text].code-input{text-align:center;letter-spacing:6px;font-family:'Lalezar';font-size:22px;text-transform:uppercase;}
 
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px;}
.iconbtn{background:var(--panel2);border:1px solid rgba(255,255,255,.1);color:var(--cream);border-radius:10px;padding:8px 12px;font-size:13px;cursor:pointer;font-weight:700;}
 
.gate-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.gate{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1.5px solid rgba(255,255,255,.08);border-radius:16px;padding:16px 10px;text-align:center;cursor:pointer;}
.gate.disabled{opacity:.35;cursor:not-allowed;}
.gate .emoji{font-size:28px;display:block;margin-bottom:6px;}
.gate .name{font-family:'Lalezar';font-size:17px;}
.gate .tag{font-size:11px;color:var(--muted);margin-top:2px;}
 
.cover{text-align:center;padding:30px 16px;}
.cover .big-emoji{font-size:52px;display:block;margin-bottom:10px;}
.letter-badge{width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,var(--gold),#c9911e);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-family:'Lalezar';font-size:40px;color:var(--bg);box-shadow:0 0 24px rgba(245,185,61,.5);}
.timer{font-family:'Lalezar';font-size:28px;color:var(--teal);text-align:center;margin-bottom:8px;}
.cat-label{font-size:13px;color:var(--muted);margin:8px 0 4px;}
table.cmp{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px;}
table.cmp th,table.cmp td{border:1px solid rgba(255,255,255,.1);padding:6px;text-align:center;}
table.cmp th{background:var(--panel2);}
.opt-btn{display:block;width:100%;text-align:right;background:var(--panel2);color:var(--cream);border:1.5px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-family:'Tajawal';font-size:14px;}
.opt-btn.correct{background:rgba(47,216,199,.25);border-color:var(--teal);}
.opt-btn.wrong{background:rgba(255,77,109,.25);border-color:var(--danger);}
.forbidden-word{display:inline-block;background:rgba(255,77,109,.15);color:var(--coral);border:1px solid var(--coral);border-radius:8px;padding:4px 10px;margin:4px;font-size:14px;}
canvas{background:#fff;border-radius:14px;touch-action:none;width:100%;display:block;}
img.live-canvas{width:100%;border-radius:14px;background:#fff;display:block;}
.pill{display:inline-block;background:var(--panel2);color:var(--muted);border-radius:20px;padding:4px 12px;font-size:12px;margin-bottom:6px;}
.footer-note{text-align:center;color:var(--muted);font-size:11px;margin-top:24px;}
.badge{display:inline-block;background:var(--panel2);color:var(--gold);border-radius:8px;padding:3px 10px;font-size:12px;margin-inline-start:6px;}
 
/* room layout */
.roomLayout{direction:ltr;display:flex;min-height:100vh;}
.sidebar{direction:rtl;width:230px;flex-shrink:0;background:var(--panel);border-inline-end:1.5px dashed rgba(245,185,61,.3);padding:16px 12px;}
.sidebar h3{font-family:'Lalezar';color:var(--gold);font-size:18px;margin:0 0 4px;}
.sidebar .code{font-family:'Lalezar';font-size:22px;letter-spacing:4px;color:var(--teal);text-align:center;background:var(--panel2);border-radius:10px;padding:8px;margin-bottom:12px;}
.plist{list-style:none;padding:0;margin:0;}
.plist li{display:flex;justify-content:space-between;align-items:center;background:var(--panel2);border-radius:10px;padding:8px 10px;margin-bottom:6px;font-size:13px;}
.plist .pts{color:var(--gold);font-weight:900;font-size:12px;}
.main{direction:rtl;flex:1;padding:18px 16px 60px;max-width:640px;}
@media (max-width:720px){
  .roomLayout{direction:rtl;flex-direction:column;}
  .sidebar{width:100%;border-inline-end:none;border-bottom:1.5px dashed rgba(245,185,61,.3);}
  .main{max-width:100%;}
}
</style>
</head>
<body>
<div id="app"></div>
 
<script>
/* ============ DATA (same content banks) ============ */
const LETTERS_POOL = ['ا','ب','ت','ث','ج','ح','خ','د','ر','ز','س','ش','ص','ط','ع','غ','ف','ق','ك','ل','م','ن','ه','و','ي'];
const LETTER_CATEGORIES = ['ولد','بنت','حيوان','نبات','جماد','بلاد'];
 
const TRIVIA = [

  {q:'في أي قارة تقع مصر؟',o:['آسيا','أفريقيا','أوروبا','أمريكا'],a:1},
  {q:'كم عدد أركان الإسلام؟',o:['3','4','5','6'],a:2},

  {q:'كم عدد أيام السنة الكبيسة؟',o:['364','365','366','367'],a:2},
  {q:'ما هو أطول نهر معروف في العالم؟',o:['النيل','دجلة','الفرات','الأمازون'],a:0},
  {q:'كم عدد اللاعبين الأساسيين في فريق كرة القدم؟',o:['9','10','11','12'],a:2},
  {q:'ما هو الغاز الأكثر وفرة في الغلاف الجوي؟',o:['الأكسجين','النيتروجين','الهيدروجين','الكربون'],a:1},
  {q:'في أي مدينة يقع برج إيفل؟',o:['لندن','باريس','روما','برلين'],a:1},
  {q:'كم عدد حروف اللغة العربية؟',o:['26','27','28','29'],a:2},
  {q:'ما هو أصغر كوكب في المجموعة الشمسية؟',o:['المريخ','عطارد','الزهرة','بلوتو'],a:1},
  {q:'ما هي عملة اليابان؟',o:['الين','الوون','اليوان','الدولار'],a:0},
  {q:'كم عدد ألوان قوس قزح؟',o:['5','6','7','8'],a:2},
  {q:'ما اسم أكبر محيط في العالم؟',o:['الأطلسي','الهندي','الهادئ','المتجمد'],a:2},
  {q:'كم عدد قطع الشطرنج لكل لاعب؟',o:['14','15','16','17'],a:2},
  {q:'ما هو الحيوان المعروف بملك الغابة؟',o:['النمر','الأسد','الفيل','الدب'],a:1},
  {q:'كم عدد أضلاع المثلث؟',o:['2','3','4','5'],a:1},
  {q:'ما هي أكبر صحراء حارة في العالم؟',o:['الربع الخالي','كالاهاري','جوبي','الصحراء الكبرى'],a:3},
  {q:'كم عدد فصول السنة؟',o:['2','3','4','5'],a:2},
  {q:'ما هو الغاز الذي يتنفسه الإنسان أساساً؟',o:['ثاني أكسيد الكربون','الأكسجين','النيتروجين','الهيليوم'],a:1},
  {q:'في أي عام هبط أول إنسان على القمر؟',o:['1965','1969','1972','1959'],a:1},
  {q:'كم عدد أيام الأسبوع؟',o:['5','6','7','8'],a:2},
];
 
const LIAR_WORDS = [
  {cat:'مهنة',w:'طبيب'},{cat:'مهنة',w:'معلم'},{cat:'حيوان',w:'أسد'},{cat:'حيوان',w:'جمل'},
  {cat:'بلد',w:'مصر'},{cat:'بلد',w:'اليابان'},{cat:'أكلة',w:'كبسة'},{cat:'أكلة',w:'بيتزا'},
  {cat:'رياضة',w:'كرة القدم'},{cat:'رياضة',w:'السباحة'},{cat:'مكان',w:'المطار'},{cat:'مكان',w:'المستشفى'},
  {cat:'فاكهة',w:'تفاح'},{cat:'فاكهة',w:'مانجو'},{cat:'وسيلة نقل',w:'طائرة'},{cat:'وسيلة نقل',w:'دراجة'},
  {cat:'مشروب',w:'قهوة'},{cat:'مشروب',w:'شاي'}
];
 
const DRAW_WORDS = ['شمس','قمر','نجمة','شجرة','بيت','سيارة','طائرة','سمكة','قطة','كلب','فيل','تفاحة',
  'موزة','كرة','ساعة','مظلة','نظارة','قلم','كتاب','هاتف','مفتاح','باب','نافذة','جبل','بحر','سحابة',
  'مطر','ثلج','نار','زهرة'];
 
const PASSWORD_WORDS = [
  {w:'قهوة',f:['مشروب','كافيين','فنجان']},{w:'مدرسة',f:['طلاب','معلم','دراسة']},
  {w:'سيارة',f:['طريق','عجلة','قيادة']},{w:'هاتف',f:['اتصال','رسالة','شاشة']},
  {w:'شمس',f:['نهار','حرارة','ضوء']},{w:'قمر',f:['ليل','نجوم','سماء']},
  {w:'مطعم',f:['أكل','طاولة','نادل']},{w:'مستشفى',f:['طبيب','مريض','دواء']},
  {w:'كرة القدم',f:['ملعب','هدف','لاعب']},{w:'مطار',f:['طائرة','سفر','جواز']},
  {w:'بحر',f:['ماء','موج','سمك']},{w:'مدينة',f:['شوارع','مباني','سكان']},
  {w:'كتاب',f:['صفحات','قراءة','مؤلف']},{w:'حاسوب',f:['شاشة','لوحة','برنامج']},
  {w:'مطبخ',f:['طبخ','فرن','أكل']},{w:'حديقة',f:['أشجار','ورد','ألعاب']},
  {w:'فندق',f:['غرفة','نزيل','استقبال']},{w:'جامعة',f:['طلاب','أستاذ','شهادة']}
];
 
const GAMES = [
  {id:'letters',emoji:'🔤',name:'حروف عزيز',tag:'حرف وفئات'},
  {id:'liar',emoji:'🎭',name:'الكذابين',tag:'اكتشف الكذاب'},
  {id:'trivia',emoji:'🧠',name:'أسئلة وتخمين',tag:'اختبر معلوماتك'},
  {id:'draw',emoji:'✏️',name:'خمن الرسمة',tag:'ارسم وخمّن'},
  {id:'password',emoji:'🔒',name:'كلمة السر',tag:'وصف بدون قول الكلمة'},
];
 
/* ============ SESSION (in-memory only) ============ */
let myId = null;
let myName = '';
let roomCode = null;
let room = null;
let pollTimer = null;
let localAnswers = {};   // letters game scratch (local before submit)
let localGuess = '';     // draw/password guess scratch
let iAmDrawingNow = false;
let uploadTimer = null;
 
function el(){return document.getElementById('app');}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rand(arr){return arr[Math.floor(Math.random()*arr.length)];}
function randomId(){return 'p_'+Math.random().toString(36).slice(2,10);}
function randomCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c='';for(let i=0;i<4;i++)c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function findPlayer(r,id){return r.players.find(p=>p.id===id);}
function isLeader(){return room && room.leaderId===myId;}
 
/* ============ STORAGE HELPERS ============ */
async function saveRoom(r){
  r.updatedAt = Date.now();
  await window.storage.set('room:'+roomCode, JSON.stringify(r), true);
  room = r;
}
async function fetchRoom(){
  try{
    const res = await window.storage.get('room:'+roomCode, true);
    if(res && res.value){ room = JSON.parse(res.value); }
  }catch(e){ /* room may not exist */ }
}
// read-modify-write helper to reduce race conditions
async function updateRoom(mutator){
  try{
    const res = await window.storage.get('room:'+roomCode, true);
    let r = res && res.value ? JSON.parse(res.value) : room;
    mutator(r);
    await saveRoom(r);
  }catch(e){
    console.error('updateRoom failed', e);
  }
}
 
/* ============ LANDING SCREEN ============ */
let landingMode = 'home'; // home | create | join
let landingName = '';
let landingCode = '';
 
function renderLanding(){
  el().innerHTML = `
    <div class="center-wrap">
      <div class="marquee-wrap">
        <div class="bulbs">
          ${Array.from({length:10}).map((_,i)=>{
            const ang=i/10*2*Math.PI; const r=90;
            const x=110+Math.cos(ang)*r, y=30+Math.sin(ang)*22;
            return `<div class="bulb" style="left:${x}px;top:${y}px;animation-delay:${(i*0.13).toFixed(2)}s"></div>`;
          }).join('')}
        </div>
        <div class="marquee-title display">ليجند تاون</div>
        <div class="subtitle">مدينة الألعاب الجماعية 🎪 كل واحد من جهازه الخاص</div>
      </div>
 
      ${landingMode==='home' ? `
        <div class="card">
          <button class="btn" onclick="landingMode='create';render();">🎫 أنشئ مجموعة جديدة</button>
          <div style="height:10px;"></div>
          <button class="btn ghost" onclick="landingMode='join';render();">🚪 انضم لمجموعة</button>
        </div>
        <div class="footer-note">شارك رابط هذه الصفحة مع أصحابك، وكل واحد يدخل من جهازه</div>
      ` : ''}
 
      ${landingMode==='create' ? `
        <div class="card">
          <div class="display" style="font-size:20px;color:var(--teal);margin-bottom:10px;">👑 أنشئ مجموعتك</div>
          <input type="text" id="createNameField" placeholder="اسمك" maxlength="14" value="${landingName}" oninput="landingName=this.value">
          <button class="btn" style="margin-top:10px;" onclick="doCreateRoom()">إنشاء 🎉</button>
          <button class="btn ghost" style="margin-top:8px;" onclick="landingMode='home';render();">رجوع</button>
        </div>
      ` : ''}
 
      ${landingMode==='join' ? `
        <div class="card">
          <div class="display" style="font-size:20px;color:var(--teal);margin-bottom:10px;">🚪 انضم لمجموعة</div>
          <input type="text" id="joinNameField" placeholder="اسمك" maxlength="14" value="${landingName}" oninput="landingName=this.value">
          <div style="height:8px;"></div>
          <input type="text" class="code-input" id="joinCodeField" placeholder="كود" maxlength="4" value="${landingCode}" oninput="landingCode=this.value.toUpperCase()">
          <button class="btn" style="margin-top:10px;" onclick="doJoinRoom()">انضمام 🙋</button>
          <button class="btn ghost" style="margin-top:8px;" onclick="landingMode='home';render();">رجوع</button>
          <div id="joinError" style="color:var(--danger);font-size:13px;margin-top:8px;"></div>
        </div>
      ` : ''}
    </div>
  `;
}
 
async function doCreateRoom(){
  const name = (landingName||'').trim();
  if(!name) return;
  myId = randomId(); myName = name; roomCode = randomCode();
  const r = {
    code: roomCode, leaderId: myId,
    players: [{id:myId, name, score:0}],
    screen:'lobby', game:{}, updatedAt: Date.now()
  };
  await saveRoom(r);
  startPolling();
  renderRoom();
}
 
async function doJoinRoom(){
  const name = (landingName||'').trim();
  const code = (landingCode||'').trim().toUpperCase();
  const errEl = document.getElementById('joinError');
  if(!name || code.length<4){ if(errEl) errEl.textContent='اكتب اسمك وكود المجموعة كامل'; return; }
  try{
    const res = await window.storage.get('room:'+code, true);
    if(!res || !res.value){ if(errEl) errEl.textContent='ما لقيت مجموعة بهذا الكود'; return; }
    let r = JSON.parse(res.value);
    if(r.players.some(p=>p.name===name)){ if(errEl) errEl.textContent='فيه لاعب بنفس الاسم، جرب اسم ثاني'; return; }
    if(r.players.length>=8){ if(errEl) errEl.textContent='المجموعة مليانة'; return; }
    myId = randomId(); myName = name; roomCode = code;
    r.players.push({id:myId, name, score:0});
    await saveRoom(r);
    startPolling();
    renderRoom();
  }catch(e){
    if(errEl) errEl.textContent='صار خطأ، جرب مرة ثانية';
  }
}
 
/* ============ POLLING ============ */
function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(tick, 1500);
}
async function tick(){
  if(!roomCode) return;
  await fetchRoom();
  if(!room) return;
  updateSidebar();
  const iAmActivelyDrawing = room.screen==='draw' && room.game && !room.game.winnerId
    && room.players[room.game.drawerIdx % room.players.length].id===myId;
  if(iAmActivelyDrawing) return; // don't disturb the drawer's own canvas
  const active = document.activeElement;
  const isTyping = active && active.tagName==='INPUT';
  if(isTyping){ patchLiveBits(); return; }
  renderRoom();
}
function patchLiveBits(){
  const img = document.getElementById('liveCanvasImg');
  if(img && room.game && room.game.canvasData) img.src = room.game.canvasData;
}
 
/* ============ ROOM SHELL ============ */
function updateSidebar(){
  const sb = document.getElementById('sidebarList');
  if(!sb || !room) return;
  sb.innerHTML = room.players.map(p=>`
    <li><span>${p.id===room.leaderId?'👑 ':''}${p.name}${p.id===myId?' (أنت)':''}</span><span class="pts">${p.score}</span></li>
  `).join('');
}
function roomShell(innerHtml){
  return `
    <div class="roomLayout">
      <div class="sidebar">
        <h3>👥 المجموعة</h3>
        <div class="code">${room.code}</div>
        <ul class="plist" id="sidebarList">
          ${room.players.map(p=>`
            <li><span>${p.id===room.leaderId?'👑 ':''}${p.name}${p.id===myId?' (أنت)':''}</span><span class="pts">${p.score}</span></li>
          `).join('')}
        </ul>
        <div class="footer-note" style="text-align:right;">شارك الكود مع أصحابك للانضمام</div>
      </div>
      <div class="main">${innerHtml}</div>
    </div>`;
}
function topbar(title){
  return `<div class="topbar">
    <button class="iconbtn" onclick="goLobby()">🏠 الرئيسية</button>
    <div class="display" style="font-size:20px;color:var(--gold)">${title}</div>
    <div class="badge">${isLeader()?'أنت القائد 👑':'لاعب'}</div>
  </div>`;
}
function goLobby(){ updateRoom(r=>{r.screen='lobby';}); renderRoom(); }
 
/* ============ MASTER RENDER ============ */
function render(){
  if(!room) renderLanding();
  else renderRoom();
}
function renderRoom(){
  if(!room){ renderLanding(); return; }
  let inner='';
  if(room.screen==='lobby') inner = lobbyHtml();
  else if(room.screen==='letters') inner = lettersHtml();
  else if(room.screen==='liar') inner = liarHtml();
  else if(room.screen==='trivia') inner = triviaHtml();
  else if(room.screen==='draw') inner = drawHtml();
  else if(room.screen==='password') inner = passwordHtml();
  el().innerHTML = roomShell(inner);
  if(room.screen==='draw') afterDrawRender();
}
 
/* ============ LOBBY ============ */
function lobbyHtml(){
  const enoughPlayers = room.players.length>=2;
  return `
    ${topbar('المدينة')}
    <div class="perforation"></div>
    ${isLeader() ? `
      <div class="gate-grid">
        ${GAMES.map(g=>`
          <div class="gate ${enoughPlayers?'':'disabled'}" onclick="${enoughPlayers?`launchGame('${g.id}')`:''}">
            <span class="emoji">${g.emoji}</span>
            <div class="name display">${g.name}</div>
            <div class="tag">${g.tag}</div>
          </div>`).join('')}
      </div>
      ${!enoughPlayers?`<div class="footer-note">لازم لاعبين اثنين ع الأقل عشان تبدأ</div>`:''}
    ` : `
      <div class="card" style="text-align:center;">
        <span style="font-size:40px;">⏳</span>
        <div style="color:var(--muted);margin-top:8px;">بانتظار القائد يختار لعبة...</div>
      </div>
    `}
  `;
}
function launchGame(id){
  updateRoom(r=>{
    r.screen = id;
    if(id==='letters') startLettersRound(r);
    if(id==='liar') startLiarRound(r);
    if(id==='trivia') startTriviaGame(r);
    if(id==='draw') startDrawRound(r);
    if(id==='password') startPasswordRound(r);
  }).then(renderRoom);
}
 
/* ============================================================
   حروف عزيز
   ============================================================ */
function startLettersRound(r){
  r.game = { phase:'answering', letter: rand(LETTERS_POOL), categories: LETTER_CATEGORIES,
    startedAt: Date.now(), duration:60, answers:{} };
  localAnswers = {};
}
function lettersHtml(){
  const g = room.game;
  if(g.phase==='answering'){
    const submitted = Object.keys(g.answers||{}).length;
    const already = g.answers[myId];
    if(!localAnswers.__init){ localAnswers = already ? {...already} : {}; localAnswers.__init=true; }
    return `
      ${topbar('حروف عزيز')}
      <div class="card" style="text-align:center;">
        <div class="letter-badge">${g.letter}</div>
        <div style="color:var(--muted);font-size:13px;">${submitted}/${room.players.length} أرسلوا إجاباتهم</div>
      </div>
      <div class="card">
        ${already ? `<div style="text-align:center;color:var(--teal);margin-bottom:8px;">✅ أرسلت إجاباتك — تقدر تعدلها وترسل مرة ثانية</div>` : ''}
        ${g.categories.map(c=>`
          <div class="cat-label">${c}</div>
          <input type="text" value="${localAnswers[c]||''}" oninput="localAnswers['${c}']=this.value">
        `).join('')}
        <button class="btn coral" style="margin-top:10px;" onclick="submitLetters()">📨 أرسل إجاباتي</button>
      </div>
      ${isLeader()?`<button class="btn" onclick="compareLetters()">📊 قارنوا الإجابات الحين</button>`:''}
    `;
  }
  if(g.phase==='compare'){
    return `
      ${topbar('حروف عزيز')}
      <div class="card">
        <div style="overflow-x:auto;">
        <table class="cmp">
          <tr><th>الفئة</th>${room.players.map(p=>`<th>${p.name}</th>`).join('')}</tr>
          ${g.categories.map(c=>`
            <tr><td>${c}</td>${room.players.map(p=>`<td>${(g.answers[p.id]&&g.answers[p.id][c])||'—'}</td>`).join('')}</tr>
          `).join('')}
        </table>
        </div>
        ${isLeader()?`
          <div class="perforation"></div>
          <div style="color:var(--muted);font-size:13px;margin-bottom:6px;">وزّع النقاط: فريدة = 10، مكررة = 5</div>
          ${room.players.map(p=>`
            <div class="row" style="align-items:center;margin-bottom:6px;">
              <span style="flex:2;">${p.name}</span>
              <button class="btn small ghost" style="flex:1;" onclick="giveLettersScore('${p.id}',5)">+5</button>
              <button class="btn small teal" style="flex:1;" onclick="giveLettersScore('${p.id}',10)">+10</button>
            </div>
          `).join('')}
          <button class="btn" style="margin-top:10px;" onclick="launchGame('letters')">🔄 جولة جديدة</button>
        `:`<div class="footer-note">القائد يوزع النقاط الحين</div>`}
      </div>
    `;
  }
}
function submitLetters(){
  const mine = {...localAnswers}; delete mine.__init;
  updateRoom(r=>{ r.game.answers[myId] = mine; }).then(renderRoom);
}
function compareLetters(){ updateRoom(r=>{ r.game.phase='compare'; }).then(renderRoom); }
function giveLettersScore(pid,pts){
  updateRoom(r=>{ const p=findPlayer(r,pid); if(p) p.score+=pts; }).then(renderRoom);
}
 
/* ============================================================
   الكذابين
   ============================================================ */
function startLiarRound(r){
  const wordObj = rand(LIAR_WORDS);
  const liarIdx = Math.floor(Math.random()*r.players.length);
  r.game = { phase:'reveal', word:wordObj.w, cat:wordObj.cat, liarId:r.players[liarIdx].id, votes:{} };
}
function liarHtml(){
  const g = room.game;
  const isMeLiar = g.liarId===myId;
  if(g.phase==='reveal'){
    return `
      ${topbar('الكذابين')}
      <div class="card cover">
        ${isMeLiar ? `
          <span class="big-emoji">🤫</span>
          <div class="display" style="font-size:22px;color:var(--danger);">أنت الكذاب!</div>
          <div style="color:var(--muted);margin-top:8px;">حاول تندمج بالكلام ولا تنكشف 😏<br>الفئة: <b>${g.cat}</b></div>
        ` : `
          <span class="big-emoji">✅</span>
          <div style="color:var(--muted);">الفئة: ${g.cat}</div>
          <div class="display" style="font-size:28px;color:var(--gold);margin:8px 0;">${g.word}</div>
          <div style="color:var(--muted);font-size:13px;">صفوا الكلمة بالكلام بدون ما تقولوها صراحة</div>
        `}
      </div>
      ${isLeader()?`<button class="btn" onclick="openLiarVote()">🗳️ افتحوا التصويت</button>`:`<div class="footer-note">تكلموا صوتياً، والقائد بيفتح التصويت</div>`}
    `;
  }
  if(g.phase==='vote'){
    const myVote = g.votes[myId];
    const votedCount = Object.keys(g.votes||{}).length;
    return `
      ${topbar('الكذابين')}
      <div class="card" style="text-align:center;">
        <div style="color:var(--muted);margin-bottom:8px;">مين برأيك الكذاب؟ (${votedCount}/${room.players.length} صوّتوا)</div>
        ${room.players.map(p=>`
          <button class="opt-btn ${myVote===p.id?'wrong':''}" onclick="castLiarVote('${p.id}')">${p.name}</button>
        `).join('')}
      </div>
      ${isLeader()?`<button class="btn coral" onclick="revealLiarResult()">🔍 كشف النتيجة</button>`:''}
    `;
  }
  if(g.phase==='result'){
    const tally = {};
    room.players.forEach(p=>tally[p.id]=0);
    Object.values(g.votes||{}).forEach(v=>{ if(tally[v]!==undefined) tally[v]++; });
    let topId=null, topCount=-1;
    for(const pid in tally){ if(tally[pid]>topCount){topCount=tally[pid];topId=pid;} }
    const caught = topId===g.liarId;
    const liarName = findPlayer(room,g.liarId)?.name || '؟';
    return `
      ${topbar('الكذابين')}
      <div class="card" style="text-align:center;">
        <span class="big-emoji">${caught?'🎉':'😬'}</span>
        <div class="display" style="font-size:20px;">${caught?'انكشف الكذاب!':'الكذاب فلت!'}</div>
        <div style="margin:10px 0;color:var(--muted);">الكذاب كان: <b style="color:var(--gold)">${liarName}</b></div>
        <div style="color:var(--muted);">الكلمة: <b style="color:var(--teal)">${g.word}</b></div>
        ${isLeader()?`<button class="btn" style="margin-top:10px;" onclick="launchGame('liar')">🔄 جولة جديدة</button>`:`<div class="footer-note">القائد يبدأ جولة جديدة</div>`}
      </div>
    `;
  }
}
function openLiarVote(){ updateRoom(r=>{ r.game.phase='vote'; r.game.votes={}; }).then(renderRoom); }
function castLiarVote(pid){ updateRoom(r=>{ r.game.votes[myId]=pid; }).then(renderRoom); }
function revealLiarResult(){
  updateRoom(r=>{
    const g=r.game;
    const tally={}; r.players.forEach(p=>tally[p.id]=0);
    Object.values(g.votes||{}).forEach(v=>{ if(tally[v]!==undefined) tally[v]++; });
    let topId=null, topCount=-1;
    for(const pid in tally){ if(tally[pid]>topCount){topCount=tally[pid];topId=pid;} }
    const caught = topId===g.liarId;
    if(caught){
      Object.entries(g.votes).forEach(([voter,accused])=>{
        if(accused===g.liarId){ const p=findPlayer(r,voter); if(p) p.score+=10; }
      });
    } else {
      const liar=findPlayer(r,g.liarId); if(liar) liar.score+=15;
    }
    g.phase='result';
  }).then(renderRoom);
}
 
/* ============================================================
   أسئلة وتخمين
   ============================================================ */
function startTriviaGame(r){
  r.game = { phase:'question', order: shuffle(TRIVIA), qIndex:0, answers:{} };
}
function triviaHtml(){
  const g = room.game;
  if(g.phase==='end'){
    const sorted=[...room.players].sort((a,b)=>b.score-a.score);
    return `
      ${topbar('أسئلة وتخمين')}
      <div class="card" style="text-align:center;">
        <span class="big-emoji">🏁</span>
        <div class="display" style="font-size:20px;margin-bottom:8px;">خلصت الأسئلة!</div>
        <ol style="text-align:right;">${sorted.map(p=>`<li>${p.name} — ${p.score}</li>`).join('')}</ol>
        ${isLeader()?`<button class="btn" onclick="launchGame('trivia')">🔄 من جديد</button>`:''}
      </div>`;
  }
  const q = g.order[g.qIndex];
  const myAns = g.answers[myId];
  const answeredCount = Object.keys(g.answers||{}).length;
  return `
    ${topbar('أسئلة وتخمين')}
    <div class="card">
      <div style="text-align:center;color:var(--muted);margin-bottom:6px;">سؤال ${g.qIndex+1}/${g.order.length} — ${answeredCount}/${room.players.length} أجابوا</div>
      <div class="display" style="font-size:18px;margin-bottom:12px;text-align:center;">${q.q}</div>
      ${q.o.map((opt,i)=>{
        let cls='';
        if(myAns!==undefined){ if(i===q.a) cls='correct'; else if(i===myAns) cls='wrong'; }
        return `<button class="opt-btn ${cls}" ${myAns!==undefined?'disabled':''} onclick="answerTrivia(${i})">${opt}</button>`;
      }).join('')}
      ${isLeader()?`<button class="btn" style="margin-top:8px;" onclick="nextTrivia()">التالي ⬅️</button>`:''}
    </div>`;
}
function answerTrivia(i){
  updateRoom(r=>{
    const g=r.game;
    if(g.answers[myId]!==undefined) return;
    g.answers[myId]=i;
    const q=g.order[g.qIndex];
    if(i===q.a){ const me=findPlayer(r,myId); if(me) me.score+=10; }
  }).then(renderRoom);
}
function nextTrivia(){
  updateRoom(r=>{
    const g=r.game;
    g.qIndex++; g.answers={};
    if(g.qIndex>=g.order.length) g.phase='end';
  }).then(renderRoom);
}
 
/* ============================================================
   خمن الرسمة
   ============================================================ */
function startDrawRound(r){
  r.game = { phase:'drawing', order: shuffle(DRAW_WORDS), di:0, drawerIdx:0,
    word: null, canvasData:null, winnerId:null, startedAt: Date.now(), duration:90 };
  r.game.word = r.game.order[0];
  localGuess='';
}
function currentDrawerId(){ return room.players[room.game.drawerIdx % room.players.length].id; }
function drawHtml(){
  const g = room.game;
  const drawerId = currentDrawerId();
  const iAmDrawer = drawerId===myId;
  iAmDrawingNow = iAmDrawer && !g.winnerId;
  const drawerName = findPlayer(room,drawerId)?.name || '؟';
 
  if(g.winnerId){
    const winnerName = findPlayer(room,g.winnerId)?.name || '؟';
    return `
      ${topbar('خمن الرسمة')}
      <div class="card" style="text-align:center;">
        <span class="big-emoji">🎉</span>
        <div class="display" style="font-size:20px;">${winnerName} خمّن صح!</div>
        <div style="color:var(--muted);margin:8px 0;">الكلمة كانت: <b style="color:var(--gold)">${g.word}</b></div>
        ${isLeader()?`<button class="btn" onclick="nextDrawRound()">التالي ➡️</button>`:`<div class="footer-note">القائد ينتقل للجولة التالية</div>`}
      </div>`;
  }
 
  if(iAmDrawer){
    return `
      ${topbar('خمن الرسمة')}
      <div class="card" style="text-align:center;">
        <div style="color:var(--muted);">كلمتك:</div>
        <div class="display" style="font-size:26px;color:var(--gold);margin:6px 0 10px;">${g.word}</div>
        <canvas id="drawCanvas" width="500" height="360"></canvas>
        <div class="row" style="margin-top:8px;">
          <button class="btn ghost small" onclick="clearCanvas()">🧹 مسح</button>
          ${isLeader()?`<button class="btn coral small" onclick="nextDrawRound()">⏭️ تخطي</button>`:''}
        </div>
      </div>`;
  }
  return `
    ${topbar('خمن الرسمة')}
    <div class="card" style="text-align:center;">
      <div style="color:var(--muted);margin-bottom:8px;">${drawerName} يرسم الحين ✏️</div>
      ${g.canvasData ? `<img class="live-canvas" id="liveCanvasImg" src="${g.canvasData}">` : `<div style="padding:60px 0;color:var(--muted);">بانتظار أول خط...</div>`}
      <div class="row" style="margin-top:10px;">
        <input type="text" id="guessField" placeholder="خمّن الكلمة..." value="${localGuess}" oninput="localGuess=this.value">
        <button class="btn small teal" onclick="submitDrawGuess()">خمّن</button>
      </div>
      ${isLeader()?`<button class="btn ghost small" style="margin-top:8px;" onclick="nextDrawRound()">⏭️ تخطي الجولة</button>`:''}
    </div>`;
}
function afterDrawRender(){
  if(iAmDrawingNow) setupCanvas();
}
function setupCanvas(){
  const c=document.getElementById('drawCanvas');
  if(!c) return;
  const ctx=c.getContext('2d');
  ctx.lineWidth=5; ctx.lineCap='round'; ctx.strokeStyle='#150F2E';
  let drawing=false;
  function pos(e){
    const r=c.getBoundingClientRect();
    const cx=c.width/r.width, cy=c.height/r.height;
    const point=e.touches?e.touches[0]:e;
    return {x:(point.clientX-r.left)*cx, y:(point.clientY-r.top)*cy};
  }
  function start(e){drawing=true;const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault();}
  function move(e){if(!drawing)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault();scheduleUpload();}
  function end(){drawing=false;scheduleUpload();}
  c.onmousedown=start;c.onmousemove=move;c.onmouseup=end;c.onmouseleave=end;
  c.ontouchstart=start;c.ontouchmove=move;c.ontouchend=end;
}
function scheduleUpload(){
  if(uploadTimer) return;
  uploadTimer = setTimeout(()=>{
    uploadTimer=null;
    const c=document.getElementById('drawCanvas');
    if(!c) return;
    const dataUrl = c.toDataURL('image/jpeg',0.5);
    updateRoom(r=>{ if(r.game && !r.game.winnerId) r.game.canvasData = dataUrl; });
  }, 900);
}
function clearCanvas(){
  const c=document.getElementById('drawCanvas');
  const ctx=c.getContext('2d');
  ctx.clearRect(0,0,c.width,c.height);
  scheduleUpload();
}
function submitDrawGuess(){
  const guess = (localGuess||'').trim();
  if(!guess) return;
  updateRoom(r=>{
    const g=r.game;
    if(g.winnerId) return;
    if(guess === g.word.trim()){
      g.winnerId = myId;
      const me=findPlayer(r,myId); if(me) me.score+=8;
      const drawer=findPlayer(r,currentDrawerIdFor(r)); if(drawer) drawer.score+=4;
    }
  }).then(()=>{ localGuess=''; iAmDrawingNow=false; renderRoom(); });
}
function currentDrawerIdFor(r){ return r.players[r.game.drawerIdx % r.players.length].id; }
function nextDrawRound(){
  updateRoom(r=>{
    const g=r.game;
    g.di++; g.drawerIdx++;
    if(g.di>=g.order.length) g.di=0;
    g.word = g.order[g.di];
    g.canvasData=null; g.winnerId=null; g.startedAt=Date.now();
  }).then(()=>{ localGuess=''; iAmDrawingNow=false; renderRoom(); });
}
 
/* ============================================================
   كلمة السر
   ============================================================ */
function startPasswordRound(r){
  r.game = { phase:'describing', order: shuffle(PASSWORD_WORDS), wi:0, describerIdx:0, item:null, winnerId:null };
  r.game.item = r.game.order[0];
  localGuess='';
}
function currentDescriberId(){ return room.players[room.game.describerIdx % room.players.length].id; }
function passwordHtml(){
  const g = room.game;
  const describerId = currentDescriberId();
  const iAmDescriber = describerId===myId;
  const describerName = findPlayer(room,describerId)?.name || '؟';
 
  if(g.winnerId){
    const winnerName = findPlayer(room,g.winnerId)?.name || '؟';
    return `
      ${topbar('كلمة السر')}
      <div class="card" style="text-align:center;">
        <span class="big-emoji">🎉</span>
        <div class="display" style="font-size:20px;">${winnerName} خمّن صح!</div>
        <div style="color:var(--muted);margin:8px 0;">الكلمة كانت: <b style="color:var(--gold)">${g.item.w}</b></div>
        ${isLeader()?`<button class="btn" onclick="nextPasswordRound()">التالي ➡️</button>`:`<div class="footer-note">القائد ينتقل للجولة التالية</div>`}
      </div>`;
  }
  if(iAmDescriber){
    return `
      ${topbar('كلمة السر')}
      <div class="card cover">
        <div style="color:var(--muted);">صف هالكلمة:</div>
        <div class="display" style="font-size:26px;color:var(--gold);margin:8px 0;">${g.item.w}</div>
        <div style="color:var(--muted);font-size:13px;margin-bottom:6px;">بدون ما تقول:</div>
        <div>${g.item.f.map(x=>`<span class="forbidden-word">${x}</span>`).join('')}</div>
      </div>
      ${isLeader()?`<button class="btn ghost small" onclick="nextPasswordRound()">⏭️ تخطي</button>`:''}
    `;
  }
  return `
    ${topbar('كلمة السر')}
    <div class="card" style="text-align:center;">
      <div style="color:var(--muted);margin-bottom:10px;">${describerName} يوصف الكلمة الحين 🗣️</div>
      <div class="row">
        <input type="text" id="pwGuessField" placeholder="خمّن الكلمة..." value="${localGuess}" oninput="localGuess=this.value">
        <button class="btn small teal" onclick="submitPasswordGuess()">خمّن</button>
      </div>
      ${isLeader()?`<button class="btn ghost small" style="margin-top:8px;" onclick="nextPasswordRound()">⏭️ تخطي الجولة</button>`:''}
    </div>`;
}
function submitPasswordGuess(){
  const guess=(localGuess||'').trim();
  if(!guess) return;
  updateRoom(r=>{
    const g=r.game;
    if(g.winnerId) return;
    if(guess === g.item.w.trim()){
      g.winnerId = myId;
      const me=findPlayer(r,myId); if(me) me.score+=8;
      const describer=findPlayer(r, r.players[g.describerIdx % r.players.length].id); if(describer) describer.score+=4;
    }
  }).then(()=>{ localGuess=''; renderRoom(); });
}
function nextPasswordRound(){
  updateRoom(r=>{
    const g=r.game;
    g.wi++; g.describerIdx++;
    if(g.wi>=g.order.length) g.wi=0;
    g.item = g.order[g.wi];
    g.winnerId=null;
  }).then(()=>{ localGuess=''; renderRoom(); });
}
 
/* ============ INIT ============ */
render();
</script>
</body>
</html>

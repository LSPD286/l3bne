<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 لعبة لعبني - Laabni</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0d0a1a;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.15);
      --primary: #8b5cf6;
      --accent: #ec4899;
      --red-btn: #e11d48;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; user-select: none; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }

    .navbar {
      width: 100%; max-width: 1000px; display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid var(--card-border);
      border-radius: 16px; margin-bottom: 20px;
    }
    .brand { font-size: 1.6rem; font-weight: 900; background: linear-gradient(135deg, #a78bfa, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .nav-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--card-border); color: white; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .nav-btn:hover { background: var(--primary); }

    .container { width: 100%; max-width: 1000px; }
    .screen { display: none; }
    .screen.active { display: block; }

    .hero { text-align: center; padding: 40px 20px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px; }
    .btn-main { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; border: none; padding: 14px 32px; font-size: 1.2rem; font-weight: bold; border-radius: 12px; cursor: pointer; margin-top: 20px; }
    .btn-main:hover { transform: scale(1.03); }

    /* Scoreboard Footer */
    .scoreboard {
      position: fixed; bottom: 0; left: 0; width: 100%; background: #15102a; border-top: 2px solid var(--primary);
      padding: 10px 20px; display: flex; justify-content: space-around; align-items: center; z-index: 90;
    }
    .team-score { text-align: center; display: flex; align-items: center; gap: 15px; }
    .score-val { font-size: 1.8rem; font-weight: 900; color: #34d399; min-width: 60px; }
    .score-btn { width: 32px; height: 32px; border-radius: 50%; border: none; font-weight: bold; font-size: 1.2rem; cursor: pointer; }
    .btn-add { background: #10b981; color: white; }
    .btn-sub { background: #ef4444; color: white; }

    /* Grid Categories (Jeopardy Style) */
    .grid-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; margin-bottom: 90px; }
    .cat-column { background: rgba(0,0,0,0.3); border: 1px solid var(--card-border); border-radius: 12px; padding: 10px; text-align: center; }
    .cat-header { background: var(--accent); color: white; padding: 10px; font-weight: bold; border-radius: 8px; margin-bottom: 10px; font-size: 1.1rem; }
    .point-card { background: rgba(255,255,255,0.08); border: 1px solid var(--card-border); border-radius: 8px; padding: 12px; margin-bottom: 8px; font-weight: 900; font-size: 1.2rem; color: #f59e0b; cursor: pointer; transition: 0.2s; }
    .point-card:hover { background: var(--primary); color: white; }
    .point-card.disabled { opacity: 0.2; cursor: not-allowed; background: #000; color: #555; }

    /* Modal for Questions */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(5px); }
    .modal.active { display: flex; }
    .modal-box { background: #1a1532; border: 2px solid var(--primary); padding: 25px; border-radius: 20px; width: 90%; max-width: 550px; text-align: center; }
    .q-points { font-size: 1rem; color: #f59e0b; margin-bottom: 10px; font-weight: bold; }
    .q-text { font-size: 1.4rem; font-weight: bold; margin: 20px 0; min-height: 80px; display: flex; align-items: center; justify-content: center; }
    .q-ans { font-size: 1.2rem; color: #34d399; margin-bottom: 20px; display: none; background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="brand">🎮 لعبني (شبكة التحدي)</div>
    <div>
      <button class="nav-btn" onclick="showScreen('screen-home')">الرئيسية</button>
    </div>
  </div>

  <div class="container">

    <!-- الصفحة الرئيسية -->
    <div id="screen-home" class="screen active">
      <div class="hero">
        <h1>تحدي شبكة النقاط 🏆</h1>
        <p>اختر الأقسام وقيمة النقاط، أجب عن الأسئلة واجمع النقاط للوصول لـ 2500 نقطة للفوز!</p>
        <button class="btn-main" onclick="startNewGame()">ابدأ اللعب الآن 🚀</button>
      </div>
    </div>

    <!-- شبكة الأسئلة والنقاط -->
    <div id="screen-board" class="screen">
      <h2 style="text-align: center; margin-bottom: 10px;">اختر الخانة وجمع النقاط</h2>
      <div class="grid-board" id="grid-board"></div>
    </div>

  </div>

  <!-- لوحة النتيجة السفلية -->
  <div class="scoreboard" id="scoreboard" style="display:none;">
    <div class="team-score">
      <span>🔴 الفريق الأول:</span>
      <button class="score-btn btn-sub" onclick="changeScore('team1', -200)">-</button>
      <span class="score-val" id="score-team1">0</span>
      <button class="score-btn btn-add" onclick="changeScore('team1', 200)">+</button>
    </div>
    <div style="font-weight: bold; color: var(--accent);">هدف الفوز: 2500</div>
    <div class="team-score">
      <span>🔵 الفريق الثاني:</span>
      <button class="score-btn btn-sub" onclick="changeScore('team2', -200)">-</button>
      <span class="score-val" id="score-team2">0</span>
      <button class="score-btn btn-add" onclick="changeScore('team2', 200)">+</button>
    </div>
  </div>

  <!-- نافذة عرض السؤال -->
  <div class="modal" id="q-modal">
    <div class="modal-box">
      <div class="q-points" id="q-points-label">سؤال بقيمة 200 نقطة</div>
      <div class="q-text" id="q-text-content">السؤال هنا...</div>
      <div class="q-ans" id="q-ans-content">الجواب: ...</div>
      
      <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
        <button class="nav-btn" style="background:#059669;" onclick="toggleAnswer()">إظهار الجواب 👁️</button>
        <button class="nav-btn" style="background:var(--primary);" onclick="awardPoints('team1')">+ نقاط للفريق الأول 🔴</button>
        <button class="nav-btn" style="background:var(--accent);" onclick="awardPoints('team2')">+ نقاط للفريق الثاني 🔵</button>
        <button class="nav-btn" style="background:#4b5563;" onclick="closeQuestion()">إغلاق ✕</button>
      </div>
    </div>
  </div>

  <script>
    let scores = { team1: 0, team2: 0 };
    let currentActivePoints = 0;
    let currentCardElem = null;

    // بنك الألعاب والأسئلة المتنوعة والمصنفة
    const categoriesData = [
      {
        name: "سبيستون 📺",
        cards: [
          { pts: 200, q: "ما اسم المحقق الذي تقلص حجمه في أنمي شهير؟", a: "كونان" },
          { pts: 400, q: "ما هي الأغنية المشهورة التي تقول 'أمي كم أهواها'؟", a: "أغنية أبطال الديجيتال / صقور الأرض" },
          { pts: 600, q: "ما اسم القط الأزرق القادم من المستقبل؟", a: "دوريمون" }
        ]
      },
      {
        name: "بباي قديم ⚓",
        cards: [
          { pts: 200, q: "ما هو الطعام الذي يعطي بباوي القوة الخارقة؟", a: "السبانخ" },
          { pts: 400, q: "ما اسم زوجة بباوي؟", a: "زيتونة (Olive Oyl)" },
          { pts: 600, q: "ما اسم عدو بباوي الضخم والمنافس له؟", a: "بلوتو (Bluto)" }
        ]
      },
      {
        name: "Call of Duty 🔫",
        cards: [
          { pts: 200, q: "ما اسم شخصية الكابتن المشهور ببراعته وقبعته المميزة؟", a: "كابتن برايس (Captain Price)" },
          { pts: 400, q: "ما هو الاسم الشهير لطور الزومبي في السلسلة؟", a: "Zombies" },
          { pts: 600, q: "ما اسم الخريطة الشهيرة جداً والمحبوكة في المساحات الضيقة (Nuk...)؟", a: "Nuketown" }
        ]
      },
      {
        name: "Resident Evil 🧟",
        cards: [
          { pts: 200, q: "ما اسم بطل الجزء الرابع الذى يذهب لإنقاذ ابنة الرئيس؟", a: "ليون كينيدي (Leon Kennedy)" },
          { pts: 400, q: "ما هي الشركة المتسببة في انتشار الفيروس والزومبي؟", a: "شركة أمبريلا (Umbrella Corporation)" },
          { pts: 600, q: "ما اسم الوحش الضخم القاتل في الجزء الثالث الذي يصرخ باسم S.T.A.R.S؟", a: "نميسس (Nemesis)" }
        ]
      },
      {
        name: "Valorant 🎯",
        cards: [
          { pts: 200, q: "ما هي الأداة أو القنبلة التي يسعى المهاجمون لزرعها في الجولة؟", a: "Spike (السبيك)" },
          { pts: 400, q: "ما اسم الشخصية الكورية السريعة التي تستخدم السكاكين (Jett)؟", a: "جيت (Jett)" },
          { pts: 600, q: "كم عدد اللاعبين في الفريق الواحد في المباراة الأساسية؟", a: "5 لاعبين" }
        ]
      }
    ];

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startNewGame() {
      scores = { team1: 0, team2: 0 };
      updateScoreUI();
      document.getElementById('scoreboard').style.display = 'flex';
      renderGrid();
      showScreen('screen-board');
    }

    function renderGrid() {
      const board = document.getElementById('grid-board');
      board.innerHTML = '';

      categoriesData.forEach((cat) => {
        let colHtml = `<div class="cat-column"><div class="cat-header">${cat.name}</div>`;
        
        cat.cards.forEach((card) => {
          colHtml += `
            <div class="point-card" onclick="openQuestion(this, '${card.q}', '${card.a}', ${card.pts})">
              ${card.pts}
            </div>
          `;
        });

        colHtml += `</div>`;
        board.innerHTML += colHtml;
      });
    }

    function openQuestion(elem, qText, aText, pts) {
      if(elem.classList.contains('disabled')) return;

      currentCardElem = elem;
      currentActivePoints = pts;

      document.getElementById('q-points-label').innerText = `سؤال بقيمة ${pts} نقطة`;
      document.getElementById('q-text-content').innerText = qText;
      document.getElementById('q-ans-content').innerText = "الجواب: " + aText;
      document.getElementById('q-ans-content').style.display = 'none';

      document.getElementById('q-modal').classList.add('active');
    }

    function toggleAnswer() {
      const ans = document.getElementById('q-ans-content');
      ans.style.display = (ans.style.display === 'none') ? 'block' : 'none';
    }

    function awardPoints(team) {
      scores[team] += currentActivePoints;
      updateScoreUI();
      closeQuestion();
      checkWin();
    }

    function closeQuestion() {
      if(currentCardElem) {
        currentCardElem.classList.add('disabled');
        currentCardElem.innerText = "✕";
      }
      document.getElementById('q-modal').classList.remove('active');
    }

    function changeScore(team, val) {
      scores[team] = Math.max(0, scores[team] + val);
      updateScoreUI();
      checkWin();
    }

    function updateScoreUI() {
      document.getElementById('score-team1').innerText = scores.team1;
      document.getElementById('score-team2').innerText = scores.team2;
    }

    function checkWin() {
      if(scores.team1 >= 2500) {
        alert("🎉 مبروك! فاز الفريق الأول بالوصول إلى 2500 نقطة!");
      } else if(scores.team2 >= 2500) {
        alert("🎉 مبروك! فاز الفريق الثاني بالوصول إلى 2500 نقطة!");
      }
    }
  </script>
</body>
</html>

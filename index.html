<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 لعبة لعبني - Laabni</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0d0a1a;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.12);
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --accent: #ec4899;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --glow: 0 0 20px rgba(139, 92, 246, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .navbar {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      margin-bottom: 25px;
    }

    .brand {
      font-size: 1.6rem;
      font-weight: 900;
      background: linear-gradient(135deg, #a78bfa, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: white;
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .nav-btn:hover {
      background: var(--primary);
      box-shadow: var(--glow);
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .screen {
      display: none;
      animation: fadeIn 0.3s ease-in-out forwards;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .hero {
      text-align: center;
      padding: 40px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      backdrop-filter: blur(10px);
    }

    .hero h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .hero p {
      color: var(--text-muted);
      margin-bottom: 30px;
      font-size: 1.1rem;
    }

    .btn-main {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: var(--glow);
      transition: transform 0.2s ease;
    }

    .btn-main:hover {
      transform: scale(1.05);
    }

    .setup-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      background: rgba(0,0,0,0.3);
      color: white;
      font-size: 1rem;
    }

    .players-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    .player-tag {
      background: var(--primary);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-tag span {
      cursor: pointer;
      color: #fca5a5;
      font-weight: bold;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .game-card:hover {
      border-color: var(--primary);
      transform: translateY(-5px);
      box-shadow: var(--glow);
    }

    .game-icon {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    .playground {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 30px;
      text-align: center;
    }

    .timer-display {
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--accent);
      margin: 20px 0;
    }

    .question-box {
      font-size: 1.5rem;
      font-weight: bold;
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.2);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .answer-box {
      font-size: 1.2rem;
      color: #34d399;
      margin-bottom: 20px;
      display: none;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-sec {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: white;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-sec:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #15102a;
      border: 1px solid var(--card-border);
      padding: 25px;
      border-radius: 20px;
      width: 90%;
      max-width: 480px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-size: 1.05rem;
    }

    .rules-list {
      text-align: right;
      margin: 15px 0;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .rules-list li {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="brand">🎮 لعبني</div>
    <div style="display: flex; gap: 10px;">
      <button class="nav-btn" onclick="shareGame()">🔗 مشاركة اللعبة</button>
      <button class="nav-btn" onclick="showScreen('screen-home')">الرئيسية</button>
      <button class="nav-btn" onclick="openSettings()">⚙️ الإعدادات</button>
    </div>
  </div>

  <div class="container">

    <!-- Screen 1: Home -->
    <div id="screen-home" class="screen active">
      <div class="hero">
        <h1>مرحباً بك في «لعبني»</h1>
        <p>مجموعة ألعاب جماعية ممتعة تعمل على جهاز واحد للجمعات والعائلات!</p>
        <button class="btn-main" onclick="showScreen('screen-players')">ابدأ اللعب الان 🚀</button>
      </div>
    </div>

    <!-- Screen 2: Players Setup -->
    <div id="screen-players" class="screen">
      <div class="setup-card">
        <h2>👥 إضافة اللاعبين (2 - 20)</h2>
        <div class="input-group">
          <input type="text" id="player-input" placeholder="اكتب اسم اللاعب هنا..." onkeypress="if(event.key==='Enter') addPlayer()">
          <button class="btn-sec" onclick="addPlayer()">إضافة</button>
        </div>
        <div class="players-list" id="players-list"></div>
      </div>
      <div style="text-align: center;">
        <button class="btn-main" onclick="goToGameSelect()">الانتقال لتحديد اللعبة 🎲</button>
      </div>
    </div>

    <!-- Screen 3: Game Select -->
    <div id="screen-games" class="screen">
      <h2 style="margin-bottom: 20px; text-align: center;">اختر اللعبة المناسبة</h2>
      <div class="games-grid" id="games-grid"></div>
    </div>

    <!-- Screen 4: Active Game Playground -->
    <div id="screen-play" class="screen">
      <div class="playground">
        <h2 id="current-game-title">اسم اللعبة</h2>
        <div class="timer-display" id="timer">30</div>
        <div class="question-box" id="question-text">اضغط "السؤال التالي" للبدء</div>
        <div class="answer-box" id="answer-text">الجواب: ...</div>

        <div class="controls">
          <button class="btn-main" onclick="nextQuestion()">السؤال التالي ➡️</button>
          <button class="btn-sec" id="ans-btn" onclick="toggleAnswer()">كشف الجواب 👁️</button>
          <button class="btn-sec" onclick="startTimer()">إعادة العداد ⏱️</button>
          <button class="btn-sec" style="border-color: #ef4444; color: #f87171;" onclick="showScreen('screen-games')">إنهاء اللعبة ❌</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Game Instructions Modal -->
  <div class="modal" id="rules-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="rules-title">📖 قواعد وشرح اللعبة</h3>
      </div>
      <div class="rules-list" id="rules-text"></div>
      <div style="text-align: center; margin-top: 20px;">
        <button class="btn-main" onclick="confirmStartGame()">فهمت، ابدأ اللعب 🎮</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->

      <div class="modal-header">
        <h3>⚙️ إعدادات اللعبة</h3>
        <button class="nav-btn" onclick="closeSettings()">✕</button>
      </div>
      <div class="setting-item">
        <span>المؤثرات الصوتية</span>
        <input type="checkbox" id="sound-toggle" checked>
      </div>
      <div class="setting-item">
        <span>وقت المؤقت الإفتراضي (ثواني)</span>
        <select id="timer-select" class="nav-btn" style="background:#000;">
          <option value="15">15 ثانية</option>
          <option value="30" selected>30 ثانية</option>
          <option value="60">60 ثانية</option>
        </select>
      </div>
      <div style="text-align: center; margin-top: 20px;">
        <button class="btn-main" onclick="closeSettings()">حفظ</button>
      </div>
    </div>
  </div>

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
      if(timerInterval) clearInterval(timerInterval);
    }

    function renderPlayers() {
      const list = document.getElementById('players-list');
      list.innerHTML = '';
      players.forEach((p, idx) => {
        list.innerHTML += `
          <div class="player-tag">
            ${p}
            <span onclick="removePlayer(${idx})">✕</span>
          </div>
        `;
      });
    }

    function addPlayer() {
      const input = document.getElementById('player-input');
      const val = input.value.trim();
      if(val && players.length < 20) {
        players.push(val);
        input.value = '';
        renderPlayers();
      }
    }

    function removePlayer(index) {
      if(players.length > 2) {
        players.splice(index, 1);
        renderPlayers();
      } else {
        alert("يجب أن يكون هناك لاعبان على الأقل!");
      }
    }

    function goToGameSelect() {
      if(players.length < 2) {
        alert("يرجى إضافة أربعة أو لاعبين على الأقل للبدء!");
        return;
      }
      renderGames();
      showScreen('screen-games');
    }

    function renderGames() {
      const grid = document.getElementById('games-grid');
      grid.innerHTML = '';
      gamesData.forEach(game => {
        grid.innerHTML += `
          <div class="game-card" onclick="openGameRules('${game.id}')">
            <div class="game-icon">${game.icon}</div>
            <h3>${game.title}</h3>
            <p style="color:var(--text-muted); margin-top:5px;">${game.questions.length} تحديات متوفرة</p>
          </div>
        `;
      });
    }

    function openGameRules(gameId) {
      selectedGameData = gamesData.find(g => g.id === gameId);
      document.getElementById('rules-title').innerText = `📖 شرح لعبة: ${selectedGameData.title}`;
      document.getElementById('rules-text').innerText = selectedGameData.rules;
      document.getElementById('rules-modal').classList.add('active');
    }

    function confirmStartGame() {
      document.getElementById('rules-modal').classList.remove('active');
      currentGame = selectedGameData;
      currentQuestionIndex = 0;
      document.getElementById('current-game-title').innerText = currentGame.title;
      showScreen('screen-play');
      nextQuestion();
    }

    function nextQuestion() {
      document.getElementById('answer-text').style.display = 'none';
      if(currentQuestionIndex < currentGame.questions.length) {
        const item = currentGame.questions[currentQuestionIndex];
        document.getElementById('question-text').innerText = item.q;
        document.getElementById('answer-text').innerText = "الجواب: " + item.a;
        currentQuestionIndex++;
        startTimer();
      } else {
        document.getElementById('question-text').innerText = "🎉 انتهت الأسئلة لهذا الوضع!";
        document.getElementById('answer-text').style.display = 'none';
        if(timerInterval) clearInterval(timerInterval);
      }
    }

    function toggleAnswer() {
      const ans = document.getElementById('answer-text');
      ans.style.display = ans.style.display === 'none' ? 'block' : 'none';
    }

    function startTimer() {
      if(timerInterval) clearInterval(timerInterval);
      const defaultTime = parseInt(document.getElementById('timer-select').value) || 30;
      timeLeft = defaultTime;
      document.getElementById('timer').innerText = timeLeft;

      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;
        if(timeLeft <= 0) {
          clearInterval(timerInterval);
          document.getElementById('timer').innerText = "⏰ انتهى الوقت!";
        }
      }, 1000);
    }

    function shareGame() {
      if (navigator.share) {
        navigator.share({
          title: 'لعبة لعبني',
          text: 'تعال نلعب مع بعض في لعبة لعبني الجماعية!',
          url: window.location.href,
        });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert("تم نسخ رابط اللعبة بنجاح! يمكنك إرساله لأصدقائك الآن.");
      }
    }

    function openSettings() {
      document.getElementById('settings-modal').classList.add('active');
    }

    function closeSettings() {
      document.getElementById('settings-modal').classList.remove('active');
    }

    renderPlayers();
  </script>
</body>
</html>
